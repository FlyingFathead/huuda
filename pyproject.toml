[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huuda"
version = "0.1.1"
description = "Finnish/Finglish command-line speech synthesis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "FlyingFathead"}]
keywords = ["tts", "finnish", "finglish", "festival", "festvox", "piper"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.scripts]
huuda = "huuda_tts.cli:main"

[project.optional-dependencies]
piper = ["piper-tts>=1.4"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["huuda_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.data-files]
"share/huuda" = ["wordreplacement.json"]
